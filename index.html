<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致杨心瑶的一封信</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f5f2e9; /* 米白色背景 */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .teddy-bear {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 120px;
            z-index: 10;
            animation: float 5s linear forwards; /* 泰迪熊动画时间为5秒 */
        }

        .teddy-bear img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .balloon {
            position: absolute;
            width: 40px;
            height: 60px;
            border-radius: 50%;
            background-color: #ff6b81;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            animation: balloonFloat 5s linear forwards; /* 气球动画时间为5秒 */
        }

        .balloon-string {
            position: absolute;
            width: 2px;
            height: 80px;
            background-color: #ff6b81;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            animation: balloonFloat 5s linear forwards; /* 气球线动画时间为5秒 */
        }

        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #5d4037;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.7);
            width: 80%;
            max-width: 600px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: fadeInOut 5s ease-in-out; /* 延长淡入淡出动画时间 */
            animation-fill-mode: forwards;
        }

        .last-message {
            animation: fadeIn 3s ease-in-out forwards; /* 调整最后一句的渐显时间为3秒 */
        }

        @keyframes float {
            0% {
                bottom: -150px;
                left: 50%;
            }
            100% {
                bottom: 100%;
                left: calc(50% + 200px);
            }
        }

        @keyframes balloonFloat {
            0% {
                top: -80px;
                left: 50%;
            }
            100% {
                top: -300px;
                left: calc(50% + 200px);
            }
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        .restart-button {
            position: absolute;
            bottom: 100px; /* 向上移动按钮 */
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px; /* 增加按钮大小 */
            background-color: #5d4037;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            font-size: 18px; /* 增加字体大小 */
        }

        .restart-button:hover {
            background-color: #3e2723;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="teddy-bear">
            <!-- 使用PNG图片作为玩具熊 -->
            <img src="b.png" alt="Teddy Bear">
        </div>
        <div class="balloon"></div>
        <div class="balloon-string"></div>
        
        <div class="message-container">
            <div class="message" style="animation-delay: 6s;">嘿，杨心瑶</div>
            <div class="message" style="animation-delay: 11s;">今天是我们在一起的第533天</div>
            <div class="message" style="animation-delay: 16s;">非常感谢你的陪伴</div>
            <div class="message" style="animation-delay: 21s;">我给你写了一封信</div>
            <div class="message" style="animation-delay: 26s;">希望你可以喜欢</div>
            <div class="message last-message" style="animation-delay: 31s;">by 爱你的张</div>
        </div>
        
        <div class="fireworks" id="fireworks"></div>
        
        <button class="restart-button" id="restart-button">查看信件</button>
    </div>

    <script>
        // 烟花特效
        function createFirework(x, y, color) {
            const fireworksContainer = document.getElementById('fireworks');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = color;
                
                // 随机角度和速度
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                const velocityX = Math.cos(angle) * speed;
                const velocityY = Math.sin(angle) * speed;
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                fireworksContainer.appendChild(particle);
                
                // 粒子动画
                let opacity = 1;
                let posX = x;
                let posY = y;
                
                function animate() {
                    posX += velocityX;
                    posY += velocityY;
                    opacity -= 0.02;
                    
                    particle.style.left = `${posX}px`;
                    particle.style.top = `${posY}px`;
                    particle.style.opacity = opacity;
                    
                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        fireworksContainer.removeChild(particle);
                    }
                }
                
                animate();
            }
        }
        
        // 随机颜色
        function getRandomColor() {
            const colors = [
                '#ff6b81', '#4facfe', '#79dc78', '#f6e841', 
                '#ff922b', '#cc2b5e', '#54a0ff', '#f06595'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // 创建烟花
        function launchFireworks() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // 创建多个烟花
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const color = getRandomColor();
                    createFirework(centerX, centerY, color);
                    
                    // 在中心周围创建更多烟花
                    for (let j = 0; j < 3; j++) {
                        const offset = 100 + Math.random() * 200;
                        const angle = Math.random() * Math.PI * 2;
                        const x = centerX + Math.cos(angle) * offset;
                        const y = centerY + Math.sin(angle) * offset;
                        setTimeout(() => {
                            createFirework(x, y, color);
                        }, i * 100 + j * 200);
                    }
                }, i * 200);
            }
        }
        
        // 当玩具熊飘到顶部时显示文字并触发烟花
        document.addEventListener('DOMContentLoaded', function() {
            const teddyBear = document.querySelector('.teddy-bear');
            const messageContainer = document.querySelector('.message-container');
            const restartButton = document.getElementById('restart-button');
            
            // 监听小熊的动画结束事件
            teddyBear.addEventListener('animationend', function() {
                // 显示文字
                messageContainer.style.opacity = '1';
                
                // 触发烟花
                setTimeout(() => {
                    launchFireworks();
                    
                    // 烟花结束后显示按钮
                    setTimeout(() => {
                        restartButton.style.opacity = '1';
                    }, 5000); // 烟花持续5秒后显示按钮
                }, 32000); // 32秒后触发烟花，确保所有文字动画完成
            });
            
            // 点击按钮时跳转到2.html
            restartButton.addEventListener('click', function() {
                window.location.href = '2.html';
            });
        });
    </script>
</body>
</html>
